<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Five ways to play with one deck</title>
  <desc id="desc">Five illustrated card groups labeled remember, compare, ask, pair, and match.</desc>
  <rect width="1000" height="420" fill="#f3f0e8"/>
  <text x="48" y="62" fill="#1f2522" font-family="system-ui, sans-serif" font-size="30" font-weight="800">One deck. Five different play loops.</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(45 105)">
      <rect width="160" height="205" rx="8" fill="#d9efe3" stroke="#2f7a55" stroke-width="3"/>
      <rect x="32" y="38" width="44" height="62" rx="6" fill="#246b8f"/>
      <rect x="84" y="38" width="44" height="62" rx="6" fill="#246b8f"/>
      <rect x="32" y="108" width="44" height="62" rx="6" fill="#246b8f"/>
      <rect x="84" y="108" width="44" height="62" rx="6" fill="#fff" stroke="#1f2522"/>
      <text x="106" y="148" font-size="26" fill="#b5473f">&#9829;</text>
      <text x="80" y="195" font-size="18" font-weight="800" fill="#1f2522">REMEMBER</text>
    </g>
    <g transform="translate(235 105)">
      <rect width="160" height="205" rx="8" fill="#eef7fb" stroke="#246b8f" stroke-width="3"/>
      <rect x="30" y="45" width="46" height="68" rx="6" fill="#fff" stroke="#1f2522"/>
      <rect x="84" y="45" width="46" height="68" rx="6" fill="#fff" stroke="#1f2522"/>
      <text x="53" y="87" font-size="25" font-weight="800" fill="#1f2522">4</text>
      <text x="107" y="87" font-size="25" font-weight="800" fill="#b5473f">6</text>
      <path d="M42 135h76" stroke="#f7c948" stroke-width="8"/>
      <text x="80" y="195" font-size="18" font-weight="800" fill="#1f2522">COMPARE</text>
    </g>
    <g transform="translate(425 105)">
      <rect width="160" height="205" rx="8" fill="#fffaf0" stroke="#d49a00" stroke-width="3"/>
      <rect x="30" y="42" width="46" height="68" rx="6" fill="#fff" stroke="#1f2522"/>
      <rect x="84" y="42" width="46" height="68" rx="6" fill="#fff" stroke="#1f2522"/>
      <text x="53" y="84" font-size="25" font-weight="800" fill="#b5473f">5</text>
      <text x="107" y="84" font-size="25" font-weight="800" fill="#1f2522">?</text>
      <path d="M76 130h42m0 0-12-10m12 10-12 10" fill="none" stroke="#2f7a55" stroke-width="5"/>
      <text x="80" y="195" font-size="18" font-weight="800" fill="#1f2522">ASK</text>
    </g>
    <g transform="translate(615 105)">
      <rect width="160" height="205" rx="8" fill="#f7e6e4" stroke="#b5473f" stroke-width="3"/>
      <rect x="28" y="44" width="46" height="68" rx="6" fill="#fff" stroke="#1f2522"/>
      <rect x="86" y="44" width="46" height="68" rx="6" fill="#fff" stroke="#1f2522"/>
      <text x="51" y="86" font-size="25" font-weight="800" fill="#b5473f">Q</text>
      <text x="109" y="86" font-size="25" font-weight="800" fill="#1f2522">Q</text>
      <path d="M45 137h70" stroke="#246b8f" stroke-width="6"/>
      <text x="80" y="195" font-size="18" font-weight="800" fill="#1f2522">PAIR</text>
    </g>
    <g transform="translate(805 105)">
      <rect width="150" height="205" rx="8" fill="#e9e4f4" stroke="#68538d" stroke-width="3"/>
      <rect x="26" y="44" width="46" height="68" rx="6" fill="#fff" stroke="#1f2522"/>
      <rect x="80" y="44" width="46" height="68" rx="6" fill="#fff" stroke="#1f2522"/>
      <text x="49" y="86" font-size="25" font-weight="800" fill="#b5473f">8</text>
      <text x="103" y="86" font-size="25" font-weight="800" fill="#b5473f">&#9829;</text>
      <path d="M38 137h74" stroke="#2f7a55" stroke-width="6"/>
      <text x="75" y="195" font-size="18" font-weight="800" fill="#1f2522">MATCH</text>
    </g>
  </g>
  <text x="50" y="365" fill="#647067" font-family="system-ui, sans-serif" font-size="20">Choose the loop the child can follow now; add more rules only when needed.</text>
