<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Finite short-form War layout</title>
  <desc id="desc">Two ten-card face-down stacks, two face-up comparison cards, and a simple point tally.</desc>
  <rect width="800" height="420" fill="#fffaf0"/>
  <text x="40" y="50" fill="#1f2522" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Short-form War: one pass, then stop</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="155" y="98" font-size="18" font-weight="800" fill="#647067">PLAYER 1</text>
    <rect x="105" y="118" width="100" height="140" rx="8" fill="#246b8f" stroke="#194b65" stroke-width="3"/>
    <rect x="235" y="118" width="100" height="140" rx="8" fill="#fff" stroke="#1f2522" stroke-width="3"/>
    <text x="285" y="202" font-size="48" font-weight="800" fill="#1f2522">4</text>
    <text x="515" y="98" font-size="18" font-weight="800" fill="#647067">PLAYER 2</text>
    <rect x="595" y="118" width="100" height="140" rx="8" fill="#246b8f" stroke="#194b65" stroke-width="3"/>
    <rect x="465" y="118" width="100" height="140" rx="8" fill="#fff" stroke="#1f2522" stroke-width="3"/>
    <text x="515" y="202" font-size="48" font-weight="800" fill="#b5473f">6</text>
    <text x="400" y="195" font-size="24" font-weight="900" fill="#d49a00">COMPARE</text>
  </g>
  <path d="M345 188h42m26 0h42" stroke="#d49a00" stroke-width="5"/>
  <circle cx="340" cy="315" r="14" fill="#f7c948"/><circle cx="375" cy="315" r="14" fill="#f7c948"/>
  <circle cx="425" cy="315" r="14" fill="#d9ded8"/><circle cx="460" cy="315" r="14" fill="#d9ded8"/>
  <text x="400" y="365" text-anchor="middle" fill="#1f2522" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Higher card earns one point. Do not recycle won cards.</text>
</svg>
