<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Twelve-card Concentration layout</title>
  <desc id="desc">A three by four face-down grid made from ace through six of hearts and diamonds.</desc>
  <rect width="800" height="420" fill="#eef7fb"/>
  <text x="40" y="50" fill="#1f2522" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Concentration: 12 cards in a 3 by 4 grid</text>
  <g fill="#246b8f" stroke="#194b65" stroke-width="2">
    <rect x="80" y="85" width="80" height="108" rx="8"/><rect x="175" y="85" width="80" height="108" rx="8"/><rect x="270" y="85" width="80" height="108" rx="8"/><rect x="365" y="85" width="80" height="108" rx="8"/>
    <rect x="80" y="210" width="80" height="108" rx="8"/><rect x="175" y="210" width="80" height="108" rx="8"/><rect x="270" y="210" width="80" height="108" rx="8"/><rect x="365" y="210" width="80" height="108" rx="8"/>
    <rect x="460" y="85" width="80" height="108" rx="8"/><rect x="555" y="85" width="80" height="108" rx="8"/><rect x="460" y="210" width="80" height="108" rx="8"/><rect x="555" y="210" width="80" height="108" rx="8"/>
  </g>
  <g fill="none" stroke="#d9efe3" stroke-width="4">
    <path d="M98 106h44v66H98zM193 106h44v66h-44zM288 106h44v66h-44zM383 106h44v66h-44z"/>
    <path d="M98 231h44v66H98zM193 231h44v66h-44zM288 231h44v66h-44zM383 231h44v66h-44z"/>
    <path d="M478 106h44v66h-44zM573 106h44v66h-44zM478 231h44v66h-44zM573 231h44v66h-44z"/>
  </g>
  <text x="80" y="365" fill="#1f2522" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Use A-6 of hearts and diamonds. A match is the same rank.</text>
</svg>
